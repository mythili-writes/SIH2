# The dashboard's status and sequential colours are validated against a light
# chart surface, so the theme is pinned rather than following the OS setting.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f4f2"
textColor = "#0b0b0b"

[server]
maxUploadSize = 200

[browser]
gatherUsageStats = false
